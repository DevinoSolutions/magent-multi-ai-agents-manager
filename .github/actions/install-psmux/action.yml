name: "Install psmux (pinned)"
description: >
  Install the pinned psmux Windows release into %LOCALAPPDATA%\psmux and put it
  on PATH, so every tier that needs a REAL multiplexer runs instead of skipping.
  Windows-only: the step no-ops elsewhere, because psmux has no POSIX build (the
  POSIX tiers shim real tmux in as psmux instead).

# ONE place owns the version + sha256. Two jobs consume this action -- the
# platform-integration Windows leg (real psmux lifecycle + the full attach chain)
# and the end-to-end Windows leg (the fleet tier's real send/model/peek wire) --
# and a pin that lived in both would drift.
#
# Release zip pinned by version + sha256 (gitleaks pattern) rather than choco:
# the community feed 504s often enough to fail unrelated runs.

runs:
  using: composite
  steps:
    - name: Install psmux (pinned)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $url = "https://github.com/psmux/psmux/releases/download/v3.3.8/psmux-v3.3.8-windows-x64.zip"
        $sha = "1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe"
        $dest = Join-Path $env:LOCALAPPDATA "psmux"
        # Idempotent: a job may use this action after something else already
        # installed it, and re-downloading would only add a flake surface.
        if (Test-Path (Join-Path $dest "psmux.exe")) {
          Write-Host "psmux already present at $dest"
        } else {
          Invoke-WebRequest -Uri $url -OutFile psmux.zip
          $actual = (Get-FileHash psmux.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "psmux.zip sha256 mismatch: $actual" }
          Expand-Archive psmux.zip -DestinationPath $dest -Force
        }
        Add-Content $env:GITHUB_PATH $dest
        # The zip ships the SAME binary under three names (psmux.exe, pmux.exe,
        # tmux.exe) plus LICENSE/README. psmux.exe is the one find_psmux() looks
        # for and the one psmux.PSMUX_IMAGE_NAMES sweeps, so that is the one
        # whose presence and version must be proven here.
        & (Join-Path $dest "psmux.exe") -V
