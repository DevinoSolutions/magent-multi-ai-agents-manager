name: CI Full (macOS + full Windows spread)

# The expensive half of the CI matrix. Billed minutes weight Windows 2x and
# macOS 10x, so ci.yml (every PR / push to main) runs Linux in full and Windows
# on the lowest + highest supported Python only. This workflow adds what that
# trims -- every macOS leg and the middle Windows Pythons -- and runs it only
# where the cost buys something: a release tag, the nightly schedule, or a
# manual dispatch. It never runs on pull_request or branch pushes.
#
# NOT a required check by design. The required check is the ci.yml job named
# "Lint + Type Check + Coverage"; nothing here can block a merge, so a macOS
# regression surfaces at the nightly run or at the release tag.

on:
  push:
    tags:
      - "v*"
  schedule:
    # 06:00 UTC, an hour before the soak, well clear of the working-day peak.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "Unit Tests (py${{ matrix.python }}, ${{ matrix.os }})"
    # Same budget rule as ci.yml: Windows runners take 12-14 min for this suite.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The Windows Pythons ci.yml skips (it keeps 3.10 and 3.14).
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest tests/unit/ -v

  platform-integration:
    name: "Platform Integration (macos-latest)"
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Setup virtual displays
        uses: ./.github/actions/setup-virtual-displays
      - name: Install terminal emulators
        uses: ./.github/actions/install-terminals
      - run: pytest tests/platform/ -v -m platform

  end-to-end:
    name: "End-to-End (macos-latest)"
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Setup virtual displays
        uses: ./.github/actions/setup-virtual-displays
      - name: Install terminal emulators
        uses: ./.github/actions/install-terminals
      # Real tmux shimmed in as psmux (no psmux binary exists for macOS), same
      # as ci.yml's POSIX legs.
      - name: Install psmux (pinned)
        uses: ./.github/actions/install-psmux
      - name: Ensure tmux (the POSIX psmux stand-in)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        # `brew install` on an already-present formula can exit non-zero, and
        # the runner image may well ship tmux -- ask before installing.
        run: brew list tmux || brew install tmux
      - name: Run e2e tests
        run: pytest tests/e2e/ -v -m "e2e and not needs_ssh and not needs_tailscale"
      - name: Setup SSH server
        id: ssh_setup
        uses: ./.github/actions/setup-ssh-server
        continue-on-error: true
      - name: Run e2e tests (SSH)
        if: steps.ssh_setup.outcome == 'success'
        run: pytest tests/e2e/ -v -m "e2e and needs_ssh"
      - name: Warn on skipped SSH e2e tests
        if: steps.ssh_setup.outcome != 'success'
        run: echo "::warning title=SSH e2e skipped::setup-ssh-server failed; needs_ssh tests did not run"

  packaged-install:
    name: "Packaged Install (macos-latest)"
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install build
      - run: pytest tests/dist/ -v -m dist
