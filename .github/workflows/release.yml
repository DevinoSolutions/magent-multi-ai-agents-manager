name: Release

# Dormant by design. Nothing is published until a maintainer pushes a `v*` tag
# AND the one-time PyPI Trusted Publisher + `pypi` GitHub environment are in
# place (see RELEASING.md). `workflow_dispatch` is a SAFE dry run — it builds
# and smoke-tests the artifacts but can never publish or cut a release, so the
# pipeline can be exercised end to end without cutting a version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build + smoke-test only, never publish or release. workflow_dispatch is always a dry run regardless (publishing is tag-push only)."
        type: boolean
        default: true

# `id-token: write` is granted here, at the WORKFLOW level, so every job can
# mint an OIDC token. PyPI accepts one only from a job in the `pypi`
# environment (the Trusted Publisher's environment constraint), i.e. publish.
# `contents: write` is elevated in github-release alone. Scoping id-token to
# the publish job is a follow-up.
permissions:
  id-token: write
  contents: read

concurrency:
  # Serialize per ref but NEVER cancel an in-flight run — a half-finished
  # publish must not be interrupted. Distinct tags have distinct refs, so real
  # releases never queue behind one another.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build (wheel)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # "true" for a PEP 440 pre-release tag (v3.20.0rc1, v3.20.0a1, v3.20.0b2,
      # v3.20.0.dev1), "false" for a final one. Empty unless the run's ref is
      # a v* tag; a run without a tag ref never reaches github-release.
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # `build` + `twine` + `packaging` are ad-hoc release tooling, deliberately
      # NOT pyproject extras (same stance as tests/dist and dependency-audit,
      # which install their tooling per-job).
      - run: python -m pip install --upgrade build twine packaging
      # A pre-release must never become the repo's "Latest" GitHub release, so
      # github-release needs to know which kind of tag this is. PEP 440 decides
      # (packaging), not a regex; a tag it cannot parse fails the build here,
      # before anything is published under a guess.
      - name: Classify the tag (PEP 440 pre-release?)
        id: classify
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import Version

          tag = os.environ["TAG"]
          prerelease = Version(tag.removeprefix("v")).is_prerelease
          print(f"{tag}: prerelease={prerelease}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"prerelease={str(prerelease).lower()}\n")
          PY
      # Wheel-only by design: the sdist is deliberately never built or published
      # (hatchling's default sdist ships tests, docs and agent plans, and a PyPI
      # upload cannot be taken back). See RELEASING.md.
      - name: Build wheel
        run: python -m build --wheel
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      # PyPI gets the version in the BUILT artifact (pyproject's), never the
      # tag's, and an upload cannot be taken back. So v3.20.0rc1 over a 3.20.0
      # build fails here, before publish. The tag must be exactly "v" + the
      # canonical PEP 440 form of the built version: v3.20.0rc1, never
      # v3.20.0-rc1, so the GitHub tag, the Release and the CHANGELOG links
      # all spell the version the way PyPI does. The built side is normalized
      # because hatchling writes pyproject's spelling into METADATA verbatim.
      # Skipped unless the run's ref is a v* tag; a workflow_dispatch on a tag
      # ref runs it too, which is harmless (publish needs a push event).
      - name: Check the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import glob
          import os
          import sys
          import zipfile
          from email.parser import BytesHeaderParser
          from packaging.version import Version

          def version_of(raw):
              return BytesHeaderParser().parsebytes(raw)["Version"]

          found = sorted(glob.glob("dist/*"))
          wheels = [p for p in found if p.endswith(".whl")]
          if len(wheels) != 1 or len(found) != 1:
              print(f"::error::expected exactly one wheel and nothing else in dist/ (releases are wheel-only), found {found}")
              sys.exit(1)
          (wheel,) = wheels
          with zipfile.ZipFile(wheel) as zf:
              (meta,) = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")]
              wheel_version = version_of(zf.read(meta))

          tag = os.environ["TAG"]
          built = Version(wheel_version)
          if tag != f"v{built}":
              print(f"::error::tag {tag} does not match the built version {built} (expected tag v{built}); bump pyproject.toml or retag")
              sys.exit(1)
          print(f"tag {tag} matches the built version {built}")
          PY
      - uses: DevinoSolutions/artifact/upload@739b3abd2f5f7bd4db8106bda6513ae94020c9e6  # v1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: "Wheel smoke (${{ matrix.os }})"
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: DevinoSolutions/artifact/download@739b3abd2f5f7bd4db8106bda6513ae94020c9e6  # v1
        with:
          name: dist
          path: dist
      # Mirror the spirit of tests/dist (pristine no-extras venv, real installed
      # console script) without re-running that pytest tier. `shell: bash` is
      # present on all three hosted runners, so one step covers every OS.
      - name: Install wheel into a clean venv and run the entry point
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .smoke-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=.smoke-venv/Scripts
            EXE=.exe
          else
            BIN=.smoke-venv/bin
            EXE=
          fi
          "$BIN/python" -m pip install --upgrade pip
          wheel=$(ls dist/*.whl)
          echo "Installing $wheel into a pristine venv"
          "$BIN/python" -m pip install "$wheel"
          "$BIN/magent$EXE" --version
          "$BIN/magent$EXE" --help

  publish:
    name: "Publish to PyPI (Trusted Publishing)"
    needs: [build, smoke]
    # Tag-push ONLY. workflow_dispatch (the dry-run path) is structurally
    # excluded here, so a dispatch can never publish — regardless of the
    # dry_run input. `!inputs.dry_run` is a defensive second gate.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      # Add required reviewers to this environment in GitHub settings to hold
      # every publish for manual approval (see RELEASING.md).
      name: pypi
      url: https://pypi.org/p/magent-multi-ai-agents-manager
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing — no API token or secret in the repo
    steps:
      - uses: DevinoSolutions/artifact/download@739b3abd2f5f7bd4db8106bda6513ae94020c9e6  # v1
        with:
          name: dist
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true

  github-release:
    name: "GitHub Release"
    needs: [build, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write  # create the GitHub Release and attach the built artifacts
    steps:
      - uses: DevinoSolutions/artifact/download@739b3abd2f5f7bd4db8106bda6513ae94020c9e6  # v1
        with:
          name: dist
          path: dist
      # A final release runs exactly the command it always has. A pre-release
      # adds `--prerelease --latest=false`, so an rc never becomes "Latest".
      # Anything but true/false fails rather than defaulting to a final release.
      # The tag reaches the script through env, never `${{ }}` inside `run:`:
      # git accepts tag names like v1$(cmd), and a template expansion would
      # run that in a job holding contents: write.
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$PRERELEASE" in
            true) kind=(--prerelease --latest=false) ;;
            false) kind=() ;;
            *) echo "::error::build.outputs.prerelease is '$PRERELEASE', expected true or false"; exit 1 ;;
          esac
          gh release create "$TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${kind[@]}"
